name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      # The Linux Secret Service backend (backend/libsecret.go) needs a real
      # D-Bus session with a Secret Service provider on it. There is no
      # Linux desktop available to verify this by hand, so this headless
      # recipe — dbus-run-session plus an unlocked gnome-keyring-daemon — is
      # the only thing that ever exercises it against a real daemon. See
      # backend/libsecret_live_test.go.
      - name: Secret Service live test (Linux only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dbus-x11 gnome-keyring
          dbus-run-session -- bash -c '
            eval $(printf "\n" | gnome-keyring-daemon --unlock --daemonize --components=secrets)
            export GNOME_KEYRING_CONTROL
            # gnome-keyring-daemon --daemonize backgrounds before the D-Bus
            # activation of org.freedesktop.secrets has necessarily settled;
            # calling into it immediately can otherwise race and see only
            # the in-memory "session" collection, not the persistent
            # "login" one. Poll for org.freedesktop.secrets bus-name
            # ownership instead of a fixed sleep: this is the only step
            # that ever exercises the Secret Service backend against a real
            # daemon (nobody on this project has a Linux desktop to debug a
            # flake here interactively), so bound on the actual readiness
            # condition rather than a guessed delay.
            ready=0
            for i in $(seq 1 50); do
              if dbus-send --session --dest=org.freedesktop.DBus --type=method_call \
                  --print-reply /org/freedesktop/DBus org.freedesktop.DBus.NameHasOwner \
                  string:org.freedesktop.secrets 2>/dev/null | grep -q "boolean true"; then
                ready=1
                break
              fi
              sleep 0.1
            done
            if [ "$ready" -ne 1 ]; then
              echo "org.freedesktop.secrets never appeared on the session bus after 5s" >&2
              exit 1
            fi
            SECRET_LIVE_DBUS_TEST=1 go test ./backend/... -run TestSecretServiceLive -v
          '
