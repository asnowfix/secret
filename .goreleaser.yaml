version: 2
project_name: secret

before:
  hooks:
    - go mod tidy

builds:
  - id: secret
    main: .
    binary: secret
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X github.com/asnowfix/secret/cmd.version={{ .Tag }}

archives:
  - id: secret
    name_template: 'secret_{{ .Tag }}_{{ .Os }}_{{ .Arch }}'
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

release:
  draft: false
  prerelease: auto
